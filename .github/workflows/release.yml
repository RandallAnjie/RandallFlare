name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-musl
      - name: Verify tag matches the binary version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rf") | .version')
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Validate deployment scripts
        run: bash -n infra/*.sh
      - name: Install pinned workerd for real-runtime tests
        run: |
          infra/fetch-workerd.sh --output "$RUNNER_TEMP/workerd-bin/workerd"
          echo "$RUNNER_TEMP/workerd-bin" >> "$GITHUB_PATH"
      - name: Test release source
        run: cargo test --workspace --all-targets --locked
      - name: Build static release
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Prepare updater assets
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/rf dist/rf-linux-x86_64
          cd dist
          sha256sum rf-linux-x86_64 > rf-linux-x86_64.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/rf-linux-x86_64
            dist/rf-linux-x86_64.sha256
