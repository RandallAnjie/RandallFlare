name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate deployment scripts
        run: |
          bash -n infra/*.sh
          infra/install-release.sh --help >/dev/null
          ! infra/install-release.sh --version latest >/dev/null 2>&1
          if command -v apparmor_parser >/dev/null; then
            apparmor_parser -KQ infra/rf-bwrap.apparmor
          fi
          grep -Fxq 'ProtectKernelTunables=false' infra/rf.service
          grep -Fxq 'ProtectKernelLogs=false' infra/rf.service
      - name: Install pinned workerd for real-runtime tests
        run: |
          infra/fetch-workerd.sh --output "$RUNNER_TEMP/workerd-bin/workerd"
          echo "$RUNNER_TEMP/workerd-bin" >> "$GITHUB_PATH"
      - name: Install Binary Deliver sandbox for real-runtime tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if command -v apparmor_parser >/dev/null; then
            sudo apparmor_parser -r infra/rf-bwrap.apparmor
          fi
          command -v bwrap
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --locked
