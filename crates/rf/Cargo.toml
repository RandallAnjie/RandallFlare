[package]
name = "rf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RandallFlare node daemon + CLI. One binary, no control plane."

[[bin]]
name = "rf"
path = "src/main.rs"

[dependencies]
rf-core = { path = "../rf-core" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
chitchat = "0.11"
axum = "0.8"
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = "0.10"
async-trait = "0.1"
hex = "0.4"
base64 = "0.22"
futures-util = "0.3"
rand = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
toml = "0.8"
mime_guess = "2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
libc = "0.2.189"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rcgen = "0.14.8"
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
instant-acme = "0.8.5"
rusqlite = { version = "0.40.1", features = ["bundled"] }
zstd = "0.13"
flate2 = "1"
jsonschema = { version = "0.33", default-features = false }
time = { version = "0.3.54", features = ["formatting"] }
mailin-embedded = { version = "0.8.3", default-features = false, features = ["rtls"] }
mail-auth = { version = "0.11.2", default-features = false, features = ["ring", "dns-hickory"] }
mail-parser = "0.11.5"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
rustls-pki-types = "1"
zeroize = "1"

[dev-dependencies]
